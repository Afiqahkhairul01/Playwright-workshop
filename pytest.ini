[pytest]
# Look for tests only in the tests folder
testpaths = tests

# Let tests import your own code, such as page objects
pythonpath = .

# The practice app's address. Tests use the part after it, for example page.goto("/login")
base_url = https://practice-web-bjhqv.azurewebsites.net

# Options added to every run
addopts =
    --import-mode=importlib
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
    --html=reports/report.html
    --self-contained-html

# Labels you can put on tests, for example @pytest.mark.smoke
markers =
    smoke: quick checks that the most important pages work

# Hide a known warning from the pytest-playwright plugin (not from your code)
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning
